name: Build På farten Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Hent projekt
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK tools
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager blev ikke fundet i $ANDROID_HOME"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Fandt sdkmanager: $SDKMANAGER"

      - name: Accepter Android licenser
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Installer Android 16 SDK
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.13
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Byg debug APK
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Klargør update-filer
        shell: bash
        run: |
          mkdir -p update-package
          cp app/build/outputs/apk/debug/app-debug.apk update-package/paafarten.apk
          cp server-update/update.json update-package/update.json
          echo "Update-pakken indeholder:"
          ls -la update-package

      - name: Gem update-pakke
        uses: actions/upload-artifact@v4
        with:
          name: PaaFarten-Update
          path: update-package/
          if-no-files-found: error
