name: Build På farten Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Hent projekt
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager blev ikke fundet i $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Fandt sdkmanager: $SDKMANAGER"

      - name: Accepter Android licenser
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Installer Android 16 SDK
        run: "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Byg debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: PaaFarten-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
